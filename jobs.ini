# ================================================================
#  AutoTeraTerm — Définition des sessions SSH
# ================================================================
# Chaque section [Nom de session] décrit une connexion SSH distincte.
#
# Champs OBLIGATOIRES :
#   ip       = adresse IP ou hostname de la cible
#   user     = nom d'utilisateur SSH
#   pass     = mot de passe SSH
#   commands = liste de commandes (une par ligne, indentées par des espaces)
#
# Champs OPTIONNELS (héritent des valeurs de config.ini si omis) :
#   port  = port SSH            (défaut : 22)
#   pause = délai entre cmds   (défaut : 2 secondes)
#
# Les lignes commençant par # sont des commentaires et sont ignorées.
# ================================================================

[Routeur-Core-1]
ip    = 192.168.1.1
user  = admin
pass  = changeme
commands =
    show version
    show ip interface brief
    show running-config

[Switch-Acces-2]
ip    = 192.168.1.2
user  = admin
pass  = changeme
port  = 22
pause = 3
commands =
    show version
    show vlan brief
    show interfaces status

[Serveur-Linux]
ip    = 10.0.0.10
user  = root
pass  = changeme
commands =
    uname -a
    df -h
    uptime
    who
