# ================================================================
#  AutoTeraTerm — Configuration globale
# ================================================================

[teraterm]
# Chemin complet vers ttermpro.exe
# Laisser vide pour la détection automatique (registre Windows + chemins courants)
path =

[session]
# Port SSH par défaut (peut être surchargé par session dans jobs.ini)
port = 22

# Version du protocole SSH : 1 ou 2
ssh_version = 2

# Pause en secondes après l'établissement de la connexion
connect_pause = 3

# Pause en secondes entre chaque instruction (défaut global, surchargeable par session)
pause = 2

# Désactiver l'avertissement de sécurité SSH au premier accès (true/false)
no_security_warning = true

# Afficher le nom de la session dans la barre de titre de la fenêtre TeraTerm
set_window_title = true

# Délai maximum en secondes pour les instructions "wait: texte" (0 = attente infinie)
wait_timeout = 30

[execution]
# true  → toutes les sessions s'ouvrent simultanément (en parallèle)
# false → chaque session attend la fermeture de la précédente (séquentiel)
parallel = true

# Délai en secondes entre chaque lancement en mode parallèle
launch_delay = 0.5

# true  → conserver les fichiers .ttl temporaires après exécution
# false → suppression automatique après un délai de sécurité de 5 secondes
keep_macros = false

# Répertoire de stockage des fichiers .ttl (laisser vide = dossier temp système)
macro_dir =
